[package]
name = "mitodo"
version = "0.1.0"
edition = "2024"
description = "a TUI todo tracker over plain markdown checklists"
homepage = "https://github.com/gwicho38/mitodo"
repository = "https://github.com/gwicho38/mitodo"
license = "GPL-3.0-or-later"
keywords = [ "todo", "tui", "markdown", "tasks" ]
categories = [ "command-line-utilities" ]
publish = true

[dependencies]
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive"] }
color-eyre = "0.6.5"
config = "0.15.17"
directories = "6.0.0"
env_logger = "0.11.8"
getset = "0.1.6"
indexmap = { version = "2.12.1", features = ["serde"] }
itertools = "0.14.0"
log = "0.4.28"
once_cell = "1.21.3"
notify = "8.0.0"
ratatui = { version = "0.30.0", features = ["all-widgets", "palette", "serde"] }
regex = "1.12.2"
serde_json = "1.0.145"
serde = { version = "1.0.226", features = ["derive"] }
sha2 = "0.10.9"
strum = { version = "0.27.2", features = ["derive", "strum_macros"] }
thiserror = "2.0.17"
tempfile = "3.14.0"
toml = "0.9.10"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
claims = "0.8.0"
rstest = "0.26.1"
